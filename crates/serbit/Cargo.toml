[package]
name = "serbit"
version = "0.1.0"
edition = "2024"

readme = "README.md"
description = "A library for high performance, bit specific, serialization & deserialization"
keywords = ["parsing", "compiler", "performance"]
categories = ["compilers", "proc-macros"]

repository.workspace = true
homepage.workspace = true
license-file.workspace = true

[dependencies]
smart_arenas = { path = "../smart_arenas" }
quote_debug = { path = "../quote_debug" }
enumtrait = { path = "../enumtrait" }
smallvec = "1.14"
num-bigint = "0.4"
proc-macro2 = { version = "1.0" }
combi = { path = "../combi" }
